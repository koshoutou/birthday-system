name: Keep Repository Active

# 保活：GitHub 会在仓库 60 天没有任何提交后自动禁用定时任务。
# 这里每半个月检查一次，只要距上次提交超过 20 天就打一个空提交，保证提醒任务不被禁用。
on:
  schedule:
    - cron: '17 3 1 * *'    # 每月 1 号（UTC 03:17 = 北京 11:17）
    - cron: '17 3 16 * *'   # 每月 16 号（双保险）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 按需创建空提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --local push.default current

          last_ts=$(git log -1 --format=%ct)
          now_ts=$(date +%s)
          days=$(( (now_ts - last_ts) / 86400 ))
          echo "距上次提交已过 ${days} 天"

          if [ "$days" -lt 20 ]; then
            echo "仓库仍然活跃（<20 天），本次不提交。"
            exit 0
          fi

          git commit --allow-empty -m "chore: keepalive 保活空提交 🤖"
          git push
          echo "已创建保活空提交。"
